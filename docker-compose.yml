services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vrptw
      POSTGRES_PASSWORD: vrptw
      POSTGRES_DB: vrptw
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vrptw"]
      interval: 5s
      timeout: 3s
      retries: 10

  solver:
    build:
      context: ./solver
    ports:
      - "8000:8000"

  osrm:
    image: osrm/osrm-backend@sha256:af5d4a83fb90086a43b1ae2ca22872e6768766ad5fcbb07a29ff90ec644ee409
    profiles: ["osrm"]
    command: osrm-routed --algorithm mld --max-table-size 1000 /data/romania-260726.osrm
    volumes:
      - ./solver/osrm-data:/data
    ports:
      - "5000:5000"

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://vrptw:vrptw@db:5432/vrptw
      SOLVER_URL: http://solver:8000
      OSRM_URL: http://osrm:5000
      DEPOT_LAT: "45.7489"
      DEPOT_LON: "21.2087"
      DEPOT_ADDRESS: "Strada Iris 13, Timisoara"
      SHIFT_START_MIN: "480"
      SHIFT_END_MIN: "1200"
      SERVICE_TIME_MIN: "5"
    depends_on:
      - db
      - solver

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      BACKEND_URL: http://backend:3000
    depends_on:
      - backend

volumes:
  pgdata: